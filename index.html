<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fernando Vásquez">
    <title>Potafolio de Fernando Vásquez</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="barra_navegacion">
            <h1>Portafolio</h1>
            <div class="botones">
                <a href="#section1" class="enlaces">Sobre mí</a>
                <a href="#section2" class="enlaces">Habilidades</a>
                <a href="#section3" class="enlaces">Proyectos</a>
                <a href="#section4" class="enlaces">Educación</a>
                <a href="#section5" class="enlaces">Contacto</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="sobre_mi" id="section1">
            <img src="static/image/WIN_20260914_13_24_06_Pro.jpg" alt="Foto de Fernando Vásquez">
            <div class="informacion_descripcion">
                <h2>Sobre Mí</h2>
                <p>Soy un estudiante de programación que ahora mismo esta aprendiendo desarrollo de sitios Web</p>
            </div>
        </section>
        <section class="habilidades" id="section2">
            <div class="porcentaje">
                <div class="lenguajes">HTML:
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 40%;">40%</div>
                    </div>
                </div>
                <div class="lenguajes">HTML5:
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 50%;">50%</div>
                    </div>
                </div>
            </div>
            <div class="porcentaje">
                <div class="lenguajes">CSS:
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 80%;">80%</div>
                    </div>
                </div>
                <div class="lenguajes">CSS3:
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 90%;">90%</div>
                    </div>
                </div>
            </div>
            <div class="lenguajes">JS:
                <div class="progress-container">
                    <div class="progress-bar" style="width: 45%;">45%</div>
                </div>
            </div>
        </section>
        <section class="proyectos" id="section3"></section>
        <section class="educacion" id="section4"></section>
        <section class="contacto" id="section5"></section>
    </main>
    <script src="static/js/script.js" defer></script>
</body>

</html>
